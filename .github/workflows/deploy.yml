name: Deploy to GitHub Pages

on:
  push:
    branches: [release/prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload
        uses: withastro/action@v3
        env:
          # GitHub Pages project site (no custom domain yet): https://<username>.github.io/<repo>.
          # Switch to a custom domain later by removing BASE_PATH and setting SITE_URL to it --
          # see astro.config.mjs and README for the rest of that walkthrough.
          SITE_URL: https://nibrasnizar.github.io
          BASE_PATH: /MyPortfolio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
